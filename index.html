<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #6a0dad;
    overflow: hidden;
  }

  body {
    position: relative;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
  }

  .photo-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: opacity 1s ease;
  }

  .photo-wrap.hide {
    opacity: 0;
    pointer-events: none;
  }

  .photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }

  .hotspot {
    position: absolute;
    top: 48%;
    left: 38%;
    width: 8%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    background: transparent;
    border: none;
    opacity: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .reveal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }

  .reveal.show {
    animation: fadeIn 2s ease-in forwards;
  }

  .reveal-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="stage">

    <div class="photo-wrap" id="photoWrap">
      <img src="images/photo.jpg" alt="photo" class="photo">
      <button class="hotspot" id="hotspot" aria-label="reveal"></button>
    </div>

    <div class="reveal" id="reveal">
      <img src="images/reveal.png" alt="reveal" class="reveal-photo">
    </div>

  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    var photoWrap = document.getElementById('photoWrap');
    var hotspot = document.getElementById('hotspot');
    var reveal = document.getElementById('reveal');

    hotspot.addEventListener('click', function () {
      photoWrap.classList.add('hide');
      reveal.classList.add('show');
      reveal.style.pointerEvents = 'auto';
    });
  </script>

</body>
</html>
