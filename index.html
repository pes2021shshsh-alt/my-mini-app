<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #6a0dad;
    overflow: hidden;
  }

  body {
    position: relative;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
  }

  .photo-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: opacity 1s ease;
  }

  .photo-wrap.hide {
    opacity: 0;
    pointer-events: none;
  }

  .photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }

  .hotspot {
    position: absolute;
    top: 48%;
    left: 38%;
    width: 8%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    background: transparent;
    border: none;
    opacity: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .reveal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }

  .reveal.show {
    animation: fadeIn 2s ease-in forwards;
  }

  .reveal-text {
    color: #ffffff;
    font-size: 22px;
    text-align: center;
    margin-bottom: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
  }

  .heart {
    color: #ffffff;
    font-size: 44px;
    line-height: 1;
  }

  .heart svg {
    width: 44px;
    height: 44px;
    fill: #ffffff;
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 400px) {
    .reveal-text {
      font-size: 18px;
    }
    .heart svg {
      width: 36px;
      height: 36px;
    }
  }
</style>
</head>
<body>

  <div class="stage">

    <div class="photo-wrap" id="photoWrap">
      <img src="images/photo.jpg" alt="photo" class="photo">
      <button class="hotspot" id="hotspot" aria-label="reveal"></button>
    </div>

    <div class="reveal" id="reveal">
      <div class="reveal-text">u are so cute</div>
      <div class="heart">
        <svg viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg">
          <path d="M23.6,0c-3.4,0-6.3,2-7.6,4.9C14.7,2,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/>
        </svg>
      </div>
    </div>

  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    var photoWrap = document.getElementById('photoWrap');
    var hotspot = document.getElementById('hotspot');
    var reveal = document.getElementById('reveal');

    hotspot.addEventListener('click', function () {
      photoWrap.classList.add('hide');
      reveal.classList.add('show');
      reveal.style.pointerEvents = 'auto';
    });
  </script>

</body>
</html>
